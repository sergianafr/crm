<body class="skin-blue fixed-layout">

    <!-- ============================================================== -->

        <div class="loader">
            <div class="loader__figure"></div>
            <p class="loader__label">CRM</p>
        </div>
    </div>
    <!-- ============================================================== -->
    <!-- Main wrapper - style you can find in pages.scss -->
    <!-- ============================================================== -->
    <div id="main-wrapper">
        <!-- ============================================================== -->
        <!-- Topbar header - style you can find in pages.scss -->
        <!-- ============================================================== -->
        <div th:insert="~{/general/header.html}"></div>
        <!-- ============================================================== -->
        <!-- End Topbar header -->
        <!-- ============================================================== -->
        <!-- ============================================================== -->
        <!-- Left Sidebar - style you can find in sidebar.scss  -->
        <!-- ============================================================== -->
        <div th:insert="~{/general/left-sidebar.html}"></div>
        <!-- ============================================================== -->
        <!-- End Left Sidebar - style you can find in sidebar.scss  -->
        <!-- ============================================================== -->
        <!-- ============================================================== -->
        <!-- Page wrapper  -->
        <!-- ============================================================== -->
        <div class="page-wrapper">
            <!-- ============================================================== -->
            <!-- Container fluid  -->
            <!-- ============================================================== -->
            <div class="container-fluid">
                <!-- ============================================================== -->
                <!-- Bread crumb and right sidebar toggle -->
                <!-- ============================================================== -->
                <div th:insert="~{/general/page-titles.html}"></div>
                <!-- ============================================================== -->
                <!-- End Bread crumb and right sidebar toggle -->
                <!-- ============================================================== -->
                <!-- ============================================================== -->
                <!-- Start Page Content -->
                <!-- ============================================================== -->
                <div class="row">
                    <div class="col-lg-12">
                        <div class="card">
                            <div class="card-body">
                                <h4 class="card-title">Create New Lead</h4>
                                <form th:object="${lead}" th:action="@{/employee/lead/create}"
                                    enctype="multipart/form-data" id="email-form" method="post">
                                    <input type="hidden" id="allFiles" name="allFiles">
                                    <label class="m-t-20" for="name">Name:</label>
                                    <div class="input-group">
                                        <input type="text" id="name" th:field="*{name}" class="form-control">
                                    </div>
                                    <div class="input-group">
                                        <span class="text-danger font-weight-bold" th:if="${#fields.hasErrors('name')}"
                                            th:errors="*{name}"></span>
                                    </div>

                                    <label class="m-t-20" for="phone">Phone:</label>
                                    <div class="input-group">
                                        <input type="text" id="phone" th:field="*{phone}" class="form-control">
                                    </div>
                                    <div class="input-group">
                                        <span class="text-danger font-weight-bold" th:if="${#fields.hasErrors('phone')}"
                                            th:errors="*{phone}" autocomplete="off"></span>
                                    </div>

                                    <label class="m-t-20" for="status">status:</label>
                                    <div class="input-group">
                                        <select id="status" th:field="*{status}" class="form-control">
                                            <option value="meeting-to-schedule">Meeting to be scheduled</option>
                                            <option value="assign-to-sales">Assign to sales representative</option>
                                            <option value="archived">Archived</option>
                                            <option value="success">success</option>
                                        </select>
                                    </div>
                                    <div class="input-group">
                                        <span class="text-danger font-weight-bold"
                                            th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></span>
                                    </div>


                                    <label class="m-t-20" for="employeeId">Assign Employee:</label>
                                    <div class="input-group">
                                        <select name="employeeId" id="employeeId" class="form-control">
                                            <option th:each="employee : ${employees}" th:text="${employee.username}"
                                                th:value="${employee.id}"></option>
                                        </select>
                                    </div>

                                    <label class="m-t-20" for="customerId">Customer:</label>
                                    <div class="input-group">
                                        <select name="customerId" id="customerId" class="form-control">
                                            <option th:each="customer : ${customers}" th:text="${customer.name}"
                                                th:value="${customer.customerId}"></option>
                                        </select>
                                    </div>
                                    <label class="m-t-20"><i class="ti-link"></i> Attachment</label>
                                    <div class="form-group">
                                        <div class="dropzone" id="my-dropzone"></div>
                                    </div>
                                    <div th:if="${hasGoogleDriveAccess}"
                                        class="col-md-5 m-b-15 custom-control custom-checkbox">
                                        <input type="checkbox" class="custom-control-input trigger-emails"
                                            th:id="googleDrive" th:field="*{googleDrive}">
                                        <label th:for="googleDrive" class="custom-control-label">Upload Docs to your
                                            Google Drive</label>
                                    </div>

                                    <br>
                                    <h5 class="card-title">Expense</h5>
                                    <label class="m-t-20" for="descriptions">Description:</label>
                                    <div class="input-group">
                                        <input type="text" id="descriptions" name="expDescriptions"
                                            class="form-control">
                                    </div>
                                    <label class="m-t-20" for="amount">Amount:</label>
                                    <div class="input-group">
                                        <input type="text" id="amount" name="expAmount" class="form-control">
                                    </div>
                                    <!-- Message de validation (carte verte) -->
                                    <div id="validMessage" class="alert alert-success mt-2" style="display: none;">
                                        <i class="fas fa-check-circle"></i> Le montant est valide.
                                    </div>

                                    <!-- Message d'avertissement (carte jaune) -->
                                    <div id="warningMessage" class="alert alert-warning mt-2" style="display: none;">
                                        <i class="fas fa-exclamation-triangle"></i> The total expense for this client has exceed the max rate.
                                    </div>

                                    <!-- Modal pour le budget dépassé -->
                                    <div class="modal fade" id="exceedModal" tabindex="-1" role="dialog"
                                        aria-labelledby="exceedModalLabel" aria-hidden="true">
                                        <div class="modal-dialog" role="document">
                                            <div class="modal-content">
                                                <div class="modal-header">
                                                    <h5 class="modal-title" id="exceedModalLabel">Warning</h5>
                                                    <button type="button" class="close" data-dismiss="modal"
                                                        aria-label="Close">
                                                        <span aria-hidden="true">&times;</span>
                                                    </button>
                                                </div>
                                                <div class="modal-body">
                                                    <p>The total expense for this customer has exceed the budget, 
                                                        still want to proceed?</p>
                                                </div>
                                                <div class="modal-footer">
                                                    <button type="button" class="btn btn-secondary"
                                                        data-dismiss="modal">Cancel</button>
                                                    <button type="button" class="btn btn-primary"
                                                        id="proceedButton">Proceed</button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <button type="submit" class="btn btn-primary m-t-20">Create Lead</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
                <div th:if="${hasGoogleDriveAccess}" class="modal fade" id="exampleModalCenter" tabindex="-1"
                    role="dialog" aria-labelledby="exampleModalCenterTitle" aria-hidden="true">
                    <div class="modal-dialog modal-dialog-centered" role="document">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title" id="exampleModalLongTitle">Create New Google Drive Folder</h5>
                                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                                    <span aria-hidden="true">&times;</span>
                                </button>
                            </div>
                            <div class="modal-body">
                                <form method="post">
                                    <input type="hidden" id="id" name="id" class="form-control">
                                    <label for="folderName" class="m-t-20">Folder Name</label>
                                    <div class="input-group">
                                        <input id="folderName" class="form-control">
                                    </div>
                                    <div class="input-group m-t-10">
                                        <span id="emailErrors" class="text-danger font-weight-bold"></span>
                                    </div>
                                </form>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                                <button type="button" class="btn btn-primary" id="create">Create</button>
                            </div>
                        </div>
                    </div>
                </div>
                <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
                <script>
                    $(document).ready(function () {
                        // Écouter l'événement 'change' sur le champ expAmount
                        $('#amount').on('change', function () {
                            // Récupérer les valeurs de customerId et expAmount
                            const customerId = $('#customerId').val();
                            const expAmount = $('#amount').val();

                            // Vérifier que les deux valeurs sont présentes
                            if (customerId && expAmount) {
                                // Préparer les données à envoyer
                                const requestData = {
                                    customerId: customerId,
                                    amount: expAmount
                                };

                                // Faire une requête AJAX vers l'endpoint /checkExpense
                                $.ajax({
                                    url: '/api/customer/checkExpense',
                                    type: 'GET',
                                    data: requestData,
                                    success: function (response) {
                                        // Cacher tous les messages
                                        $('#validMessage').hide();
                                        $('#warningMessage').hide();

                                        // Afficher le message approprié
                                        if (response === 'valid') {
                                            $('#validMessage').show(); // Afficher la carte verte
                                        } else if (response === 'superior') {
                                            $('#warningMessage').show(); // Afficher la carte jaune
                                        } else if (response === 'exceed') {
                                            $('#exceedModal').modal('show'); // Afficher le modal
                                        }
                                    },
                                    error: function (xhr, status, error) {
                                        console.error('Erreur lors de la requête :', error);
                                        alert('Une erreur est survenue lors de la vérification de la dépense.');
                                    }
                                });
                            } else {
                                alert('Veuillez sélectionner un client et saisir un montant.');
                            }
                        });

                        // Gérer le clic sur le bouton "Procéder" dans le modal
                        $('#proceedButton').on('click', function () {
                            alert('Vous avez choisi de procéder avec le budget dépassé.');
                            $('#exceedModal').modal('hide'); // Fermer le modal
                        });

                    });
                </script>

                <!-- .right-sidebar -->
                <div th:insert="~{/general/right-sidebar.html}"></div>
            </div>
            <!-- ============================================================== -->
            <!-- End Container fluid  -->
            <!-- ============================================================== -->
        </div>
        <!-- ============================================================== -->
        <!-- End Page wrapper  -->
        <!-- ============================================================== -->
        <!-- ============================================================== -->
        <!-- footer -->
        <!-- ============================================================== -->
        <div th:insert="~{/general/footer.html}"></div>
        <!-- ============================================================== -->
        <!-- End footer -->
        <!-- ============================================================== -->
    </div>

    <!-- End Wrapper -->
    <!-- ============================================================== -->

        var home = /*[[${home}]]*/ null;
    </script>

    <!--    &lt;!&ndash; Bootstrap tether Core JavaScript &ndash;&gt;-->
    <script th:src="@{/js/library/popper.min.js}" type="text/javascript"></script>
