<body class="skin-blue fixed-layout">

<!-- ============================================================== -->

    <div class="loader">
        <div class="loader__figure"></div>
        <p class="loader__label">CRM</p>
    </div>

<!-- ============================================================== -->
<!-- Main wrapper - style you can find in pages.scss -->
<!-- ============================================================== -->
<div id="main-wrapper">
    <!-- ============================================================== -->
    <!-- Topbar header - style you can find in pages.scss -->
    <!-- ============================================================== -->
    <div th:insert="~{/general/header.html}"></div>
    <!-- ============================================================== -->
    <!-- End Topbar header -->
    <!-- ============================================================== -->
    <!-- ============================================================== -->
    <!-- Left Sidebar - style you can find in sidebar.scss  -->
    <!-- ============================================================== -->
    <div th:insert="~{/general/left-sidebar.html}"></div>
    <!-- ============================================================== -->
    <!-- End Left Sidebar - style you can find in sidebar.scss  -->
    <!-- ============================================================== -->
    <!-- ============================================================== -->
    <!-- Page wrapper  -->
    <!-- ============================================================== -->
    <div class="page-wrapper">
        <!-- ============================================================== -->
        <!-- Container fluid  -->
        <!-- ============================================================== -->
        <div class="container-fluid">
            <!-- ============================================================== -->
            <!-- Bread crumb and right sidebar toggle -->
            <!-- ============================================================== -->
            <div th:insert="~{/general/page-titles.html}"></div>
            <!-- ============================================================== -->
            <!-- End Bread crumb and right sidebar toggle -->
            <!-- ============================================================== -->
            <!-- ============================================================== -->
            <!-- Start Page Content -->
            <!-- ============================================================== -->
            <div class="row">
                <div class="col-lg-12">
                    <div class="card">
                        <div class="card-body">
                            <h4 class="card-title">Create New Ticket</h4>
                            <form th:object="${ticket}" th:action="@{/employee/ticket/create-ticket}" method="post">

                                <label class="m-t-20" for="subject">Subject:</label>
                                <div class="input-group">
                                    <input type="text" id="subject" th:field="*{subject}" class="form-control">
                                </div>
                                <div class="input-group">
                                    <span class="text-danger font-weight-bold" th:if="${#fields.hasErrors('subject')}" th:errors="*{subject}"></span>
                                </div>

                                <label class="m-t-20" for="description">Description:</label>
                                <div class="input-group">
                                    <textarea class="textarea_editor form-control" id="description" rows="15" placeholder="Enter text ..." th:field="*{description}"></textarea>
                                </div>
                                <div class="input-group">
                                    <span class="text-danger font-weight-bold" th:if="${#fields.hasErrors('description')}" th:errors="*{description}" autocomplete="off"></span>
                                </div>

                                <label class="m-t-20" for="status">status:</label>
                                <div class="input-group">
                                    <select id="status" th:field="*{status}" class="form-control">
                                        <option value="open">Open</option>
                                        <option value="assigned">Assigned</option>
                                        <option value="on-hold">On Hold</option>
                                        <option value="in-progress">In Progress</option>
                                        <option value="resolved">Resolved</option>
                                        <option value="closed">Closed</option>
                                        <option value="reopened">Reopened</option>
                                        <option value="pending-customer-response">Pending Customer Response</option>
                                        <option value="escalated">Escalated</option>
                                        <option value="archived">Archived</option>
                                    </select>
                                </div>
                                <div class="input-group">
                                    <span class="text-danger font-weight-bold" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></span>
                                </div>

                                <label class="m-t-20" for="priority">Priority:</label>
                                <div class="input-group">
                                    <select id="priority" th:field="*{priority}" class="form-control">
                                        <option value="low">Low</option>
                                        <option value="medium">Medium</option>
                                        <option value="high">High</option>
                                        <option value="closed">Closed</option>
                                        <option value="urgent">Urgent</option>
                                        <option value="critical">Critical</option>
                                    </select>
                                </div>
                                <div class="input-group">
                                    <span class="text-danger font-weight-bold" th:if="${#fields.hasErrors('priority')}" th:errors="*{priority}"></span>
                                </div>

                                <label class="m-t-20" for="employeeId">Assign Employee:</label>
                                <div class="input-group">
                                    <select name="employeeId" id="employeeId" class="form-control">
                                        <option th:each="employee : ${employees}" th:text="${employee.username}" th:value="${employee.id}"></option>
                                    </select>
                                </div>

                                <label class="m-t-20" for="customerId">Customer:</label>
                                <div class="input-group">
                                    <select name="customerId" id="customerId" class="form-control">
                                        <option th:each="customer : ${customers}" th:text="${customer.name}" th:value="${customer.customerId}"></option>
                                    </select>
                                </div>
                                <br>
                                <h5 class="card-title">Expense</h5>
                                <label class="m-t-20" for="descriptions">Description:</label>
                                <div class="input-group">
                                    <input type="text" id="descriptions" name="expDescriptions" class="form-control">
                                </div>
                                <label class="m-t-20" for="amount">Amount:</label>
                                <div class="input-group">
                                    <input type="text" id="amount" name="expAmount" class="form-control">
                                </div>
                                <div id="validMessage" class="alert alert-success mt-2" style="display: none;">
                                    <i class="fas fa-check-circle"></i> Valid amount.
                                </div>

                                <!-- Message d'avertissement (carte jaune) -->
                                <div id="warningMessage" class="alert alert-warning mt-2" style="display: none;">
                                    <i class="fas fa-exclamation-triangle"></i> The total expense for this client has exceed the max rate.
                                </div>

                                <!-- Modal pour le budget dépassé -->
                                <div class="modal fade" id="exceedModal" tabindex="-1" role="dialog"
                                    aria-labelledby="exceedModalLabel" aria-hidden="true">
                                    <div class="modal-dialog" role="document">
                                        <div class="modal-content">
                                            <div class="modal-header">
                                                <h5 class="modal-title" id="exceedModalLabel">Warning</h5>
                                                <button type="button" class="close" data-dismiss="modal"
                                                    aria-label="Close">
                                                    <span aria-hidden="true">&times;</span>
                                                </button>
                                            </div>
                                            <div class="modal-body">
                                                <p>The total expense for this customer has exceed the budget, 
                                                    still want to proceed?</p>
                                            </div>
                                            <div class="modal-footer">
                                                <button type="button" class="btn btn-secondary"
                                                    data-dismiss="modal">Cancel</button>
                                                <button type="button" class="btn btn-primary"
                                                    id="proceedButton">Proceed</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-primary m-t-20">Create ticket</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
            <script>

                $(document).ready(function () {
                    // Écouter l'événement 'change' sur le champ expAmount
                    $('#amount').on('change', function () {
                        // Récupérer les valeurs de customerId et expAmount
                        const customerId = $('#customerId').val();
                        const expAmount = $('#amount').val();
                
                        if (customerId && expAmount) {
                            // Préparer les données à envoyer
                            const requestData = {
                                customerId: customerId,
                                amount: expAmount
                            };
                
                            $.ajax({
                                url: '/api/customer/checkExpense',
                                type: 'GET',
                                data: requestData,
                                success: function (response) {
                                    // Cacher tous les messages
                                    $('#validMessage').hide();
                                    $('#warningMessage').hide();
                
                                    // Afficher le message approprié
                                    if (response.status === 'valid') {
                                        $('#validMessage').show(); 
                                    } else if (response.status === 'superior') {
                                        $('#warningMessage').text(`The total expense for this client has exceeded the max rate (${response.maxRate}%-${response.maxValueRate}).`);
                                        $('#warningMessage').show(); // Afficher la carte jaune
                                    } else if (response.status === 'exceed') {
                                        $('#exceedModal .modal-body').html(`<p>The total expense for this customer has exceeded the budget rate (${response.maxRate}%-${response.maxValueRate})<br> Customer Budget:${response.totalBudget}<br> Still want to proceed?</p>`);
                                        $('#exceedModal').modal('show'); // Afficher le modal
                                    }
                                },
                                error: function (xhr, status, error) {
                                    console.error('Erreur lors de la requête :', error);
                                    alert('Une erreur est survenue lors de la vérification de la dépense.');
                                }
                            });
                        } else {
                            alert('Veuillez sélectionner un client et saisir un montant.');
                        }
                    });
                
                    // Gérer le clic sur le bouton "Procéder" dans le modal
                    $('#proceedButton').on('click', function () {
                        // alert('Vous avez choisi de procéder avec le budget dépassé.');
                        $('#exceedModal').modal('hide'); // Fermer le modal
                    });
                
                    // Gérer le clic sur le bouton "Annuler" dans le modal
                    $('.modal-footer .btn-secondary').on('click', function() {
                        $('#amount').val('0'); // Réinitialiser la valeur du champ amount à 0
                        $('#exceedModal').modal('hide'); // Fermer le modal
                    });
                });
            </script>
            <!-- ============================================================== -->
            <!-- End Page Content -->
            <!-- ============================================================== -->
            <!-- ============================================================== -->
            <!-- Right sidebar -->
            <!-- ============================================================== -->
            <!-- .right-sidebar -->
            <div th:insert="~{/general/right-sidebar.html}"></div>
            <!-- ============================================================== -->
            <!-- End Right sidebar -->
            <!-- ============================================================== -->
        </div>
        <!-- ============================================================== -->
        <!-- End Container fluid  -->
        <!-- ============================================================== -->

    <!-- ============================================================== -->

    <!-- End footer -->

</div>
