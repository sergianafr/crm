<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:insert="~{/general/head.html}"></div>
    <meta name="_csrf" content="${_csrf.token}"/>
    <meta name="_csrf_header" content="${_csrf.headerName}"/>
    <link rel="stylesheet" th:href="@{/css/bootstrap-wysihtml5.css}"/>
    <link rel="stylesheet" href="https://unpkg.com/dropzone@5/dist/min/dropzone.min.css" type="text/css" />
    <link th:href="@{/css/style.min.css}" rel="stylesheet">
    <link th:href="@{/css/pages/inbox.css}" rel="stylesheet">
    <style>
        .error-card {
            border-left: 4px solid #dc3545;
        }
        .error-badge {
            background-color: #dc3545;
        }
        .file-badge {
            background-color: #e2edf7;
        }
        .error-details {
            font-size: 0.9rem;
        }
        .error-message {
            white-space: pre-wrap;
            color: #dc3545;
        }
    </style>
</head>

<body class="skin-blue fixed-layout">
<div class="preloader">
    <div class="loader">
        <div class="loader__figure"></div>
        <p class="loader__label">CRM</p>
    </div>
</div>

<div id="main-wrapper">
    <div th:insert="~{/general/header.html}"></div>
    <div th:insert="~{/general/left-sidebar.html}"></div>

    <div class="page-wrapper">
        <div class="container-fluid">
            <!-- Header -->
            <div th:insert="~{/general/page-titles.html}"></div>

            <!-- Messages d'alerte -->
            <div class="row  mt-3">
                <div class="col">
                    <!-- Message de succès -->
                    <div th:if="${importErrors != null and importErrors.empty}" 
                         class="alert alert-success alert-dismissible fade show">
                        <i class="bi bi-check-circle me-2"></i> Import successful!
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    
                    <!-- Erreur globale -->
                    <div th:if="${globalError != null}" 
                         class="alert alert-danger alert-dismissible fade show">
                        <i class="bi bi-exclamation-triangle me-2"></i>
                        <span th:text="${globalError}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    
                    <!-- Carte des erreurs d'import -->
                    <div th:if="${importErrors != null and !importErrors.empty}" 
                         class="card error-card mb-4">
                        <div class="card-header bg-white d-flex justify-content-between align-items-center">
                            <h5 class="mb-0">
                                Error during importation
                            </h5>
                            <span class="badge error-badge rounded-pill">
                                <span th:text="${importErrors.size()}"></span>errors
                            </span>
                        </div>
                        
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-hover table-sm mb-0">
                                    <thead>
                                        <tr>
                                            <th width="20%">File</th>
                                            <th width="15%">Row</th>
                                            <th width="15%">Col</th>
                                            <th>Message</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="error : ${importErrors}">
                                            <td>
                                                <span class="badge file-badge rounded-pill" 
                                                      th:text="${error.file}">File</span>
                                            </td>
                                            <td th:text="${error.rowNum != 0} ? ${error.rowNum} : 'N/A'">Ligne</td>
                                            <td th:text="${error.colNum != 0} ? ${error.colNum} : 'N/A'">Colonne</td>
                                            <td class="error-message" th:text="${error.message}">Message</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        
                        <div class="card-footer bg-white">
                            <div class="d-flex justify-content-between align-items-center">
                                <small class="text-muted">
                                    <i class="bi bi-info-circle me-1"></i>
                                    Please correct these errors before importing files
                                </small>
                                
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Formulaire d'import -->
            <div class="row ">
                <div class="col">
                    <div class="card file-upload-card">
                        <div class="card-body p-4">
                            <h4 class="card-title mb-4 text-primary">
                                <i class="bi bi-upload me-2"></i>Import Data
                            </h4>
                            
                            <form th:action="@{/employee/import}" method="post" enctype="multipart/form-data">
                                <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}"/>
                                
                                <!-- Fichier Employés -->
                                <div class="mb-4">
                                    <label for="employeeFile" class="file-upload-label">
                                        <i class="bi bi-file-earmark-spreadsheet me-2"></i>Customers (CSV)
                                    </label>
                                    <input type="file" class="form-control" name="customers" id="employeeFile" required
                                           accept=".csv, application/vnd.ms-excel, text/csv">
                                </div>
                                
                                <!-- Fichier Départements -->
                                <div class="mb-4">
                                    <label for="departmentFile" class="file-upload-label">
                                        <i class="bi bi-file-earmark-text me-2"></i>Tickets & Leads (CSV)
                                    </label>
                                    <input type="file" class="form-control" name="leadticket" id="departmentFile"
                                           accept=".csv, application/vnd.ms-excel, text/csv">
                                </div>
                                <div class="mb-4">
                                    <label for="departmentFile" class="file-upload-label">
                                        <i class="bi bi-file-earmark-text me-2"></i>Budget(CSV)
                                    </label>
                                    <input type="file" class="form-control" name="budget" id="departmentFile"
                                           accept=".csv, application/vnd.ms-excel, text/csv">
                                </div>
                                
                                <div class="d-flex justify-content-between align-items-center">
                                    <button type="submit" class="btn btn-primary submit-btn">
                                        <i class="bi bi-upload me-2"></i>Import
                                    </button>
                                    
                                    <a th:href="${home + 'reinit'}" class="btn btn-outline-danger reset-btn">
                                        <i class="bi bi-trash me-2"></i>Reset database
                                    </a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Sidebar -->
            <div th:insert="~{/general/right-sidebar.html}"></div>
        </div>
    </div>

    <div th:insert="~{/general/footer.html}"></div>
</div>

<script th:inline="javascript">
    var home = /*[[${home}]]*/ null;
</script>
<script th:src="@{/js/library/jquery-3.2.1.min.js}" type="text/javascript"></script>
<script th:src="@{/js/library/popper.min.js}" type="text/javascript"></script>
<script th:src="@{/js/library/bootstrap.min.js}" type="text/javascript"></script>
<script th:src="@{/js/library/perfect-scrollbar.jquery.min.js}" type="text/javascript"></script>
<script th:src="@{/js/library/waves.js}" type="text/javascript"></script>
<script th:src="@{/js/library/sidebarmenu.js}" type="text/javascript"></script>
<script th:src="@{/js/library/sticky-kit.min.js}"></script>
<script th:src="@{/js/library/jquery.sparkline.min.js}" type="text/javascript"></script>
<script th:src="@{/js/library/custom.min.js}" type="text/javascript"></script>
<script th:src="@{/js/library/wysihtml5-0.3.0.js}"></script>
<script th:src="@{/js/library/bootstrap-wysihtml5.js}"></script>
<script src="https://unpkg.com/dropzone@5/dist/min/dropzone.min.js"></script>
<script>
    Dropzone.autoDiscover = false;
    $(document).ready(function() {
        $('.textarea_editor').wysihtml5();
    });
</script>
<script th:inline="javascript">
    /*<![CDATA[*/
    var existingFiles = /*[[${attachments}]]*/ 'default';
    var folders = /*[[${folders}]]*/ 'default';
    var driveFolderId = "";
    /*]]>*/
</script>
<script th:src="@{/js/general-dropzone.js}" type="text/javascript"
        th:data-csrf-token="${_csrf.token}" th:data-csrf-header="${_csrf.headerName}"></script>
</body>
</html>
